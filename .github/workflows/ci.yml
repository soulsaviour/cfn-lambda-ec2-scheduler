name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install tooling
        run: pip install -r requirements-dev.txt
      - name: cfn-lint
        run: cfn-lint template.yaml
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -q
