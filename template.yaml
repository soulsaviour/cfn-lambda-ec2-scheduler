AWSTemplateFormatVersion: "2010-09-09"
Description: Starts and stops EC2 instances tagged Schedule=<value>.

Parameters:
  TagValue:
    Type: String
    Default: office-hours
    Description: Instances tagged Schedule=<this value> are managed by the scheduler.

  StopScheduleExpression:
    Type: String
    Default: cron(0 20 ? * MON-FRI *)
    Description: When to stop instances, as an EventBridge Scheduler expression.

  StartScheduleExpression:
    Type: String
    Default: cron(0 8 ? * MON-FRI *)
    Description: When to start instances, as an EventBridge Scheduler expression.

  Timezone:
    Type: String
    Default: Asia/Kolkata
    Description: IANA time zone the schedule expressions are evaluated in.

  DryRun:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Log the instances that would be started or stopped, without acting.

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ec2-start-stop
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: FindInstances
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              # The function can only start or stop instances that carry the
              # schedule tag, even if it is invoked with something unexpected.
              - Sid: StartStopTaggedInstances
                Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Schedule: !Ref TagValue

  SchedulerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Starts or stops EC2 instances tagged for the schedule.
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: scheduler.handler
      Code: src/
      Role: !GetAtt FunctionRole.Arn
      Timeout: 120
      MemorySize: 128
      Environment:
        Variables:
          TAG_VALUE: !Ref TagValue
          DRY_RUN: !Ref DryRun

  # EventBridge Scheduler, unlike EventBridge rules, evaluates cron in a local
  # time zone, so "8 AM" stays 8 AM across daylight saving changes.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-scheduler-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SchedulerFunction.Arn

  StopSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Stop instances tagged for the schedule
      ScheduleExpression: !Ref StopScheduleExpression
      ScheduleExpressionTimezone: !Ref Timezone
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt SchedulerFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"action": "stop"}'
        RetryPolicy:
          MaximumRetryAttempts: 2

  StartSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Start instances tagged for the schedule
      ScheduleExpression: !Ref StartScheduleExpression
      ScheduleExpressionTimezone: !Ref Timezone
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt SchedulerFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"action": "start"}'
        RetryPolicy:
          MaximumRetryAttempts: 2

Outputs:
  FunctionName:
    Value: !Ref SchedulerFunction
  FunctionArn:
    Value: !GetAtt SchedulerFunction.Arn
